<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="tesla — small, sharp tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="0.5" stop-color="#c58cff"/>
      <stop offset="1" stop-color="#ff8fa3"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.4 0;0.4 0;-0.4 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7aa2ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff8fa3" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ff8fa3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1000" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="18" fill="url(#grid)"/>

  <circle cx="170" cy="60" r="190" fill="url(#glow1)">
    <animate attributeName="cx" values="170;260;170" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="220" r="210" fill="url(#glow2)">
    <animate attributeName="cy" values="220;150;220" dur="12s" repeatCount="indefinite"/>
  </circle>

  <text x="64" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" fill="#8b949e">~/tesla $</text>
  <text x="64" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" fill="url(#ink)">small, sharp tools</text>
  <rect x="624" y="140" width="4" height="56" fill="#c58cff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
  <text x="66" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#c9d1d9" fill-opacity="0.8">offline-first apps · linux desktop tools · machine learning that runs locally</text>
</svg>
